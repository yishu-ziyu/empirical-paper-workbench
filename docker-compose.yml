x-app-runtime: &app-runtime
  # 构建上下文必须是项目根，Dockerfile 需要同时 COPY backend/ 和 agent/。
  build:
    context: .
    dockerfile: backend/Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
  environment:
    DATABASE_URL: postgresql+asyncpg://econpaper:${POSTGRES_PASSWORD}@postgres:5432/econpaper
    CHECKPOINT_DB_URL: postgresql://econpaper:${POSTGRES_PASSWORD}@postgres:5432/econpaper
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
    JWT_ALGORITHM: HS256
    ACCESS_TOKEN_EXPIRE_HOURS: 24
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    UPLOAD_DIR: /data/uploads
    DEBUG: "false"
    S3_ENDPOINT_URL: http://minio:9000
    # 专用最小权限用户（由 minio-init 创建），不是 MinIO root。
    S3_ACCESS_KEY_ID: ${S3_ECONPAPER_USER:-econpaper}
    S3_SECRET_ACCESS_KEY: ${S3_ECONPAPER_PASSWORD:?set S3_ECONPAPER_PASSWORD}
    S3_BUCKET: econpaper-uploads
    S3_PATH_PREFIX: uploads/
    S3_CACHE_DIR: /data/uploads/.s3_cache
    RUNS_DIR: /data/runs
    SESSIONS_PATH: /data/sessions/sessions.json
    # LLM 路由配置透传：config.py 在 DEBUG=false 时会拒绝 mock / 无 key 部署。
    ECONPAPER_LLM: ${ECONPAPER_LLM:-}
    GENERATE_LLM_PROVIDER: ${GENERATE_LLM_PROVIDER:-}
    GENERATE_LLM_MODEL: ${GENERATE_LLM_MODEL:-}
    GENERATE_LLM_API_KEY: ${GENERATE_LLM_API_KEY:-}
    REVIEW_LLM_PROVIDER: ${REVIEW_LLM_PROVIDER:-}
    REVIEW_LLM_MODEL: ${REVIEW_LLM_MODEL:-}
    REVIEW_LLM_API_KEY: ${REVIEW_LLM_API_KEY:-}
    MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  volumes:
    - uploads:/data/uploads
    - runs:/data/runs
    - sessions_data:/data/sessions

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: econpaper
      POSTGRES_USER: econpaper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U econpaper"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # 锁定版本（审查 P2-11）：latest 会随上游变更导致部署不可复现。
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 一次性初始化：建 bucket + 创建仅限该 bucket 的最小权限用户。
  # backend 的 S3 凭据用这个专用用户，不复用 MinIO root（审查 P1-9）。
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_ECONPAPER_USER: ${S3_ECONPAPER_USER:-econpaper}
      S3_ECONPAPER_PASSWORD: ${S3_ECONPAPER_PASSWORD:?set S3_ECONPAPER_PASSWORD}
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/econpaper-uploads &&
      (mc admin user add local \"$$S3_ECONPAPER_USER\" \"$$S3_ECONPAPER_PASSWORD\" || true) &&
      printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:PutObject\",\"s3:GetObject\",\"s3:DeleteObject\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::econpaper-uploads\",\"arn:aws:s3:::econpaper-uploads/*\"]}]}' > /tmp/policy.json &&
      (mc admin policy create local econpaper-app /tmp/policy.json || true) &&
      mc admin policy attach local econpaper-app --user \"$$S3_ECONPAPER_USER\"
      "

  backend:
    <<: *app-runtime
    ports:
      - "127.0.0.1:8000:8000"

  runner:
    <<: *app-runtime
    command: ["python", "-m", "backend.runner"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'backend.runner'"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
  minio_data:
  uploads:
  runs:
  sessions_data:
