[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "econpaper-agent"
version = "0.1.0"
description = "LangGraph agent layer for econpaper"
requires-python = ">=3.12"

[tool.setuptools]

[tool.setuptools.packages.find]
where = [".."]
include = ["agent*"]
namespaces = false