server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /run/pilot/tls.crt;
    ssl_certificate_key /run/pilot/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Private pilot";
    auth_basic_user_file /run/pilot/htpasswd;
    client_max_body_size 51m;
    error_page 413 = @upload_too_large;
    location @upload_too_large {
        default_type application/json;
        return 413 '{"detail":"File exceeds 50MB upload limit"}';
    }
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 900s;
    }
    # Container health only; no application data is returned here.
    location = /gateway-health { auth_basic off; return 200 "ok"; }
}
