# Overlay the existing stack; never exposes its API or stores secrets in the image.
services:
  backend:
    ports: !reset []
  frontend:
    ports: !reset []
  archive:
    image: ${ECONPAPER_IMAGE:-econpaper-backend:local}
    profiles: [maintenance]
    network_mode: none
    entrypoint: [tar]
    volumes:
      - minio_data:/objects
  gateway:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PILOT_TLS_PORT:-18443}:443"
    volumes:
      - ./deploy/private-pilot/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PILOT_SECRETS_DIR:?set PILOT_SECRETS_DIR}:/run/pilot:ro
